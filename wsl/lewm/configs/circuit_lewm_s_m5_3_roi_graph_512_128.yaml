name: circuit_lewm_s_m5_3_roi_graph_512_128
model:
  tier: LeWM-S
  encoder: vit_tiny
  image_size: 224
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
data:
  train_manifest: data/circuit_curricula/train.jsonl
  holdout_manifest: data/circuit_curricula/holdout.jsonl
  source_dataset: bshada/open-schematics
  train_limit: 512
  holdout_limit: 128
  augmentation_policy: none
target:
  mode: roi_graph_set
  lib_vocab_size: 512
  family_vocab_size: 64
  includes:
    - symbol_lib_count_vector
    - symbol_family_count_vector
    - tile_4x4_symbol_occupancy
    - count_and_layout_scalars
    - roi_crop_trace
training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.00005
  weight_decay: 0.001
  precision: bf16
loss:
  lambda_align: 1.0
  lambda_mask: 1.0
  lambda_target: 0.5
  lambda_tile: 0.25
  lambda_sigreg: 0.09
  temperature: 0.07
outputs:
  summary: results/lewm_s/m5_3_roi_graph_diagnostic.json
  checkpoint_policy: local_only_wsl_runtime
